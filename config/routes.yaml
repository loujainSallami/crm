controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

api_login_check:
    path: /api/login_check
api_login:
    path: /api/login
api_refresh_token:
    path: /api/token/refresh

# USERS
api_delete_user_direct:
    path: /api/vicidial/user/{userId}/delete-direct
    controller: App\Controller\UsersController\UserController::deleteUserDirectly
    methods: [DELETE]

api_add_user:
    path: /api/vicidial/user
    controller: App\Controller\UsersController\UserController::addUser
    methods: [POST]

api_update_user:
    path: /api/vicidial/user
    controller: App\Controller\UsersController\UserController::updateUser
    methods: [PUT]

api_delete_user:
    path: /api/vicidial/user/{userId}
    controller: App\Controller\UsersController\UserController::deleteUser
    methods: [DELETE]

api_get_user_info:
    path: /api/vicidial/user/{userId}
    controller: App\Controller\UsersController\UserController::getUserInfo
    methods: [GET]

api_get_users:
    path: /api/vicidial/users
    controller: App\Controller\UsersController\UserController::getUsers
    methods: [GET]

# GROUPS
api_get_groups:
    path: /api/vicidial/groups
    controller: App\Controller\UsersController\Group\GroupController::getGroups
    methods: [GET]

api_add_group:
    path: /api/vicidial/groups/create
    controller: App\Controller\UsersController\Group\GroupController::addGroup
    methods: [POST]

api_update_group:
    path: /api/vicidial/groups/update/{userGroup}
    controller: App\Controller\UsersController\Group\GroupController::updateGroup
    methods: [PUT, POST]

api_delete_group:
    path: /api/vicidial/groups/{userGroup}
    controller: App\Controller\UsersController\Group\GroupController::deleteGroup
    methods: [DELETE]

api_get_user_groups_from_group_controller:
    path: /api/vicidial/user-groups
    controller: App\Controller\UsersController\Group\GroupController::getUserGroups
    methods: [GET]

# CAMPAIGNS
api_create_campaign:
    path: /api/vicidial/campaign
    controller: App\Controller\CampaignController\CampaignController::addCampaign
    methods: [POST, OPTIONS]

api_delete_campaign:
    path: /api/vicidial/campaign/{campaignId}
    controller: App\Controller\CampaignController\CampaignController::deleteCampaign
    methods: [DELETE]

api_update_campaign:
    path: /api/vicidial/campaign/{campaignId}
    controller: App\Controller\CampaignController\CampaignController::updateCampaign
    methods: [PUT]

api_get_user_groups:
    path: /api/vicidial/user-groups
    controller: App\Controller\CampaignController\CampaignController::getUserGroups
    methods: [GET]

api_get_campaigns:
    path: /api/vicidial/campaigns
    controller: App\Controller\CampaignController\CampaignController::getCampaigns
    methods: [GET]

api_get_campaign:
    path: /api/vicidial/campaign/{campaignId}
    controller: App\Controller\CampaignController\CampaignController::getCampaign
    methods: [GET]

